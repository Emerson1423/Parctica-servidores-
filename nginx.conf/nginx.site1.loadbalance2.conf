
server {

    listen 80 default_server;
    server_name site1.localhost.com;
    server_name site6.localhost.com;
    server_name site7.localhost.com;
    server_name site8.localhost.com;
    server_name site9.localhost.com;
    server_name site10.localhost.com;
    server_name site11.localhost.com;

    root /app;

    location / {
        try_files $uri $uri/index.php;
    }

    location ~ \.php$ {
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param HTTP_CLIENT_IP  $http_x_real_ip;
        fastcgi_param HTTP_NOTE  "<h1>Site 1 - site1.localhost.com</h1><br>Load balance instance <b>2</b>";
    }

}
